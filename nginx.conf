server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # add_header in a location block drops server-level headers, so the
    # security headers are repeated in each location.

    # Hashed build assets — cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Chat assistant API (aftr-chat container). Resolved at request time so nginx
    # still starts if the chat container is down; buffering off so replies stream.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $chat http://aftr-chat:8787;
        proxy_pass $chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
        gzip off;
        client_max_body_size 64k;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
