server {
    # nginx-unprivileged image: runs as a non-root user, so it listens on 8080
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Relative Location headers, so redirects never leak the internal port behind Caddy
    absolute_redirect off;

    # Real visitor IP: Caddy (on the docker bridge) sets X-Forwarded-For. Only trust it from
    # private Docker networks, so a visitor can't fake their IP to dodge the chat rate limit.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;
    gzip_min_length 1024;

    # Clean URLs only: /services/ -> /services (one canonical URL per page)
    rewrite ^/(.+)/$ /$1 permanent;
    # Old .html URLs -> clean URLs
    if ($request_uri ~ ^/index\.html$) { return 301 /; }
    if ($request_uri ~ ^/(.+)\.html$) { return 301 /$1; }

    # Hashed build assets: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Innovation Hub API (hub-api container). Also answers Caddy's forward_auth check for the
    # demo subdomains (/api/hub/auth/verify). Cookie and Origin headers pass through unchanged.
    location /api/hub/ {
        resolver 127.0.0.11 valid=30s;
        set $hub http://hub-api:8790;
        proxy_pass $hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # Signed-in Hub pages (/hub/login, /hub/app, /hub/admin, ...): never cached or indexed.
    # The public landing page /hub is served by "location /" below and stays indexable.
    location /hub/ {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/security-headers.conf;
    }

    # Chat assistant API (aftr-chat container). Resolved at request time so nginx
    # still starts if the chat container is down; buffering off so replies stream.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $chat http://aftr-chat:8787;
        proxy_pass $chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
        gzip off;
        client_max_body_size 64k;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # Every page is prerendered: "/" -> index.html, "/services/x" -> services/x.html.
    # Anything else is a real 404 (not a "soft 404" home page), which Google needs.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
