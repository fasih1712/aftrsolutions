# Runs on the same EC2 server as Thesis Craft Mentors.
# That server's Caddy (inside the `thesiscraftmentors` container, default bridge
# network) owns ports 80/443. This container is not publicly exposed:
#   - 127.0.0.1:8081  -> for curl checks on the host
#   - 172.17.0.1:8081 -> docker0 bridge IP, so the Caddy container can reach it
# Caddy reverse-proxies aftrsolutions.com -> 172.17.0.1:8081.
services:
  aftr-web:
    build: .
    image: aftr-web:latest
    container_name: aftr-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
      - "172.17.0.1:8081:8080"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - aftr-chat

  # Website AI assistant. Only reachable by nginx (aftr-web) on the compose network.
  # Keys come from .env next to this file (written by the deploy workflow from GitHub
  # secrets). GEMINI_API_KEY (free tier) is used first; ANTHROPIC_API_KEY is the paid
  # alternative. With neither, the chat widget simply stays hidden.
  aftr-chat:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: aftr-chat:latest
    container_name: aftr-chat
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  # Innovation Hub API: sign-up, admin approval, sessions and the forward_auth check that
  # protects the demo subdomains. Only reachable by nginx (aftr-web) on the compose network.
  # Users live in SQLite on the hub-data volume, so they survive redeploys.
  # HUB_ADMIN_EMAILS (comma-separated) + HUB_ADMIN_PASSWORD create the admins on first start.
  hub-api:
    build:
      context: .
      dockerfile: hub/Dockerfile
    image: hub-api:latest
    container_name: hub-api
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      HUB_ADMIN_EMAILS: ${HUB_ADMIN_EMAILS:-}
      HUB_ADMIN_PASSWORD: ${HUB_ADMIN_PASSWORD:-}
      HUB_COOKIE_DOMAIN: .aftrsolutions.com
    volumes:
      - hub-data:/data
    mem_limit: 128m

volumes:
  hub-data:
