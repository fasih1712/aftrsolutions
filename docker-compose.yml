# Runs on the same EC2 server as Thesis Craft Mentors.
# That server's Caddy (inside the `thesiscraftmentors` container, default bridge
# network) owns ports 80/443. This container is not publicly exposed:
#   - 127.0.0.1:8081  -> for curl checks on the host
#   - 172.17.0.1:8081 -> docker0 bridge IP, so the Caddy container can reach it
# Caddy reverse-proxies aftrsolutions.com -> 172.17.0.1:8081.
services:
  aftr-web:
    build: .
    image: aftr-web:latest
    container_name: aftr-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
      - "172.17.0.1:8081:80"
    depends_on:
      - aftr-chat

  # Website AI assistant. Only reachable by nginx (aftr-web) on the compose network.
  # Keys come from .env next to this file (written by the deploy workflow from GitHub
  # secrets). GEMINI_API_KEY (free tier) is used first; ANTHROPIC_API_KEY is the paid
  # alternative. With neither, the chat widget simply stays hidden.
  aftr-chat:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: aftr-chat:latest
    container_name: aftr-chat
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
