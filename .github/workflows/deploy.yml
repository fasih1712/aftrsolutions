name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: image with Google Chrome preinstalled (used by npm run a11y)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build   # fail fast before touching the server
      - run: npm run knowledge   # chat assistant knowledge must build too
      # The runner image ships Google Chrome, so no Playwright browser download / apt deps needed.
      - run: npm run a11y   # blocks the deploy on any critical/serious axe violation
        env:
          CHANNEL: chrome

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # Keyless deploy: GitHub OIDC -> IAM role -> AWS SSM Run Command on the EC2 server.
    # No SSH key, no open port 22 needed for this repo. Role trust is limited to
    # Aftr-Solutions/aftrsolutions on refs/heads/main.
    permissions:
      id-token: write   # needed to request the OIDC token
      contents: read
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-0fe1dd19adfb072d6
      PARAM_PATH: /aftrsolutions
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::545908811041:role/github-actions-aftr-deploy
          role-session-name: aftrsolutions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # GitHub secrets stay the source of truth. Each non-empty one is copied into SSM
      # Parameter Store (SecureString); the server reads them with its instance role, so
      # secret values never appear in the SSM command or its history. An empty/missing
      # secret leaves the stored value untouched.
      - name: Sync app secrets to Parameter Store
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUB_ADMIN_EMAILS: ${{ secrets.HUB_ADMIN_EMAILS }}
          HUB_ADMIN_PASSWORD: ${{ secrets.HUB_ADMIN_PASSWORD }}
          HUB_ADMIN_NAMES: ${{ secrets.HUB_ADMIN_NAMES }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          HUB_NOTIFY_EMAIL: ${{ secrets.HUB_NOTIFY_EMAIL }}
        run: |
          for name in GEMINI_API_KEY ANTHROPIC_API_KEY HUB_ADMIN_EMAILS HUB_ADMIN_PASSWORD HUB_ADMIN_NAMES \
                      SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS HUB_NOTIFY_EMAIL; do
            value="${!name}"
            [ -n "$value" ] || { echo "skip $name (not set in GitHub)"; continue; }
            aws ssm put-parameter --name "$PARAM_PATH/$name" --type SecureString \
              --value "$value" --overwrite >/dev/null
            echo "synced $name"
          done

      - name: Deploy via SSM Run Command
        run: |
          set -euo pipefail
          B64=$(base64 -w0 deploy/server-deploy.sh)
          jq -n --arg b64 "$B64" --arg sha "$GITHUB_SHA" '{
            commands: [
              "echo \($b64) | base64 -d > /tmp/aftr-deploy.sh",
              "chmod 755 /tmp/aftr-deploy.sh",
              "sudo -H -u ubuntu bash /tmp/aftr-deploy.sh \($sha) 2>&1"
            ],
            executionTimeout: ["1200"]
          }' > params.json
          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "aftrsolutions ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CID"
          STATUS=Pending
          for i in $(seq 1 120); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          echo "::group::Server output"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "::endgroup::"
          ERR=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text)
          [ -z "$ERR" ] || { echo "::group::Server errors"; echo "$ERR"; echo "::endgroup::"; }
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]
