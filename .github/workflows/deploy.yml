name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build   # fail fast before touching the server
      - run: npm run knowledge   # chat assistant knowledge must build too
      - run: npx playwright install --with-deps chromium
      - run: npm run a11y   # blocks the deploy on any critical/serious axe violation

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUB_ADMIN_EMAILS: ${{ secrets.HUB_ADMIN_EMAILS }}
          HUB_ADMIN_PASSWORD: ${{ secrets.HUB_ADMIN_PASSWORD }}
        with:
          envs: GEMINI_API_KEY,ANTHROPIC_API_KEY,HUB_ADMIN_EMAILS,HUB_ADMIN_PASSWORD
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            APP_DIR="$HOME/aftrsolutions"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main
            # Secrets -> .env (mode 600, kept out of git). Each non-empty secret replaces its own
            # line; a secret that is empty or missing in GitHub leaves the existing line alone,
            # so a deploy can never wipe a key. Values are single-quoted so docker compose reads
            # them literally (a value must not contain a single quote).
            #   GEMINI_API_KEY = chat, free tier (used first); ANTHROPIC_API_KEY = chat, paid alternative
            #   HUB_ADMIN_EMAILS / HUB_ADMIN_PASSWORD = Innovation Hub admins, created on first start
            umask 077
            touch .env
            chmod 600 .env
            set_env() {
              [ -n "$2" ] || return 0
              case "$2" in *"'"*) echo "Skipping $1: value contains a single quote"; return 0 ;; esac
              grep -v "^$1=" .env > .env.tmp || true
              printf "%s='%s'\n" "$1" "$2" >> .env.tmp
              mv .env.tmp .env
            }
            set_env GEMINI_API_KEY "$GEMINI_API_KEY"
            set_env ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
            set_env HUB_ADMIN_EMAILS "$HUB_ADMIN_EMAILS"
            set_env HUB_ADMIN_PASSWORD "$HUB_ADMIN_PASSWORD"
            docker compose up -d --build
            docker image prune -f
            sleep 3
            curl -fsS -o /dev/null http://127.0.0.1:8081 && echo "AFTR site is up on 127.0.0.1:8081"
            echo "Chat assistant: $(curl -fsS http://127.0.0.1:8081/api/health || echo 'not reachable')"
            echo "Innovation Hub API: $(curl -fsS http://127.0.0.1:8081/api/hub/health || echo 'not reachable')"
