name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build   # fail fast before touching the server
      - run: npm run knowledge   # chat assistant knowledge must build too

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          envs: GEMINI_API_KEY,ANTHROPIC_API_KEY
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            APP_DIR="$HOME/aftrsolutions"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main
            # Chat assistant keys: written from GitHub secrets, kept out of git (.gitignore).
            # GEMINI_API_KEY = free tier (used first), ANTHROPIC_API_KEY = paid alternative.
            if [ -n "$GEMINI_API_KEY$ANTHROPIC_API_KEY" ]; then
              umask 077
              : > .env
              if [ -n "$GEMINI_API_KEY" ]; then printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env; fi
              if [ -n "$ANTHROPIC_API_KEY" ]; then printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" >> .env; fi
            fi
            docker compose up -d --build
            docker image prune -f
            sleep 3
            curl -fsS -o /dev/null http://127.0.0.1:8081 && echo "AFTR site is up on 127.0.0.1:8081"
            echo "Chat assistant: $(curl -fsS http://127.0.0.1:8081/api/health || echo 'not reachable')"
